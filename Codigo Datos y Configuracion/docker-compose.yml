# Servicios de almacenamiento del pipeline: PostgreSQL 16 (F1) y MongoDB (F2, F3).
# Uso:  docker compose up -d   (las credenciales se leen de .env; ver .env.example)
services:
  postgres:
    image: postgres:16
    container_name: pi_postgres
    environment:
      POSTGRES_USER: ${PG_USER:-pi_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-cambiar_esta_clave}
      POSTGRES_DB: ${PG_DB:-proyecto_integrador}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-pi_user} -d ${PG_DB:-proyecto_integrador}"]
      interval: 5s
      retries: 10

  mongo:
    image: mongo:8.0
    container_name: pi_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10

volumes:
  pg_data:
  mongo_data:
